<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="MattySpins">
  <!--
    The tab mark: the same M$ badge the site header draws in CSS.

    Drawn as paths rather than text because a favicon is rendered by the
    browser chrome, where the site's webfont does not exist — set in type it
    would fall back to whatever the OS had and stop being the logo.
  -->
  <defs>
    <radialGradient id="disc" cx="30%" cy="25%" r="85%">
      <stop offset="0" stop-color="#16425f"/>
      <stop offset="0.7" stop-color="#08131d"/>
      <stop offset="1" stop-color="#050a10"/>
    </radialGradient>
  </defs>

  <circle cx="50" cy="50" r="50" fill="url(#disc)"/>
  <circle cx="50" cy="50" r="47.5" fill="none" stroke="#22d3ff" stroke-width="3" opacity="0.5"/>

  <!-- M -->
  <path d="M22.5 69V33.5l14.5 22 14.5-22V69" fill="none" stroke="#ffd166" stroke-width="8.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- $ -->
  <g fill="none" stroke="#c9d3dc" stroke-width="6" stroke-linecap="round">
    <path d="M80 43.5c0-5-6-7.5-11-6-6 1.8-6.6 8.4 0 11 7 2.8 11.5 4.6 11.5 9.5 0 5.4-7 8-13.5 4.5"/>
    <path d="M71.5 29v42"/>
  </g>
</svg>
