<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="vipBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#34133b"/>
      <stop offset="100%" stop-color="#120c16"/>
    </radialGradient>
    <linearGradient id="purpleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="vipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#a855f7" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#vipBg)"/>
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="url(#purpleGold)" stroke-width="1.5" stroke-opacity="0.5"/>
  <g filter="url(#vipGlow)" transform="translate(60, 62)">
    <!-- Crown -->
    <path d="M -30,8 L -34,-16 L -16,-4 L 0,-24 L 16,-4 L 34,-16 L 30,8 Z" fill="url(#crownGrad)"/>
    <!-- Jewels on tips -->
    <circle cx="-34" cy="-16" r="3.5" fill="#E879F9"/>
    <circle cx="0" cy="-24" r="4.5" fill="#38BDF8"/>
    <circle cx="34" cy="-16" r="3.5" fill="#E879F9"/>
    <!-- Crown Base / Band -->
    <rect x="-30" y="8" width="60" height="8" rx="2" fill="#B45309"/>
    <!-- Diamond studs on band -->
    <polygon points="-18,12 -15,9 -12,12 -15,15" fill="#FFFFFF"/>
    <polygon points="0,12 3,9 6,12 3,15" fill="#FFFFFF"/>
    <polygon points="18,12 21,9 24,12 21,15" fill="#FFFFFF"/>
  </g>
</svg>
