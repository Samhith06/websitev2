<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b2d18"/>
      <stop offset="100%" stop-color="#141312"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="40%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#e5a93c" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#bgGlow)"/>
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Casino chip ring / High Roller badge -->
  <g filter="url(#goldGlow)" transform="translate(60,60)">
    <circle r="38" fill="#1e1e24" stroke="url(#goldGrad)" stroke-width="4"/>
    <!-- Dashes on chip rim -->
    <circle r="38" fill="none" stroke="#FFF2A3" stroke-width="4" stroke-dasharray="8 12" stroke-dashoffset="4"/>
    <circle r="26" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- Two 3D dice in center -->
    <g transform="translate(-10, -8) rotate(-12)">
      <rect x="-12" y="-12" width="24" height="24" rx="4" fill="url(#diceGrad)"/>
      <circle cx="-5" cy="-5" r="2.2" fill="#d97706"/>
      <circle cx="5" cy="5" r="2.2" fill="#d97706"/>
      <circle cx="0" cy="0" r="2.2" fill="#d97706"/>
    </g>
    <g transform="translate(10, 8) rotate(18)">
      <rect x="-11" y="-11" width="22" height="22" rx="4" fill="url(#goldGrad)"/>
      <circle cx="-4" cy="-4" r="2" fill="#1e1b18"/>
      <circle cx="4" cy="4" r="2" fill="#1e1b18"/>
      <circle cx="-4" cy="4" r="2" fill="#1e1b18"/>
      <circle cx="4" cy="-4" r="2" fill="#1e1b18"/>
    </g>
  </g>
</svg>
