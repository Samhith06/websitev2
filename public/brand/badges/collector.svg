<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="collBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#361a34"/>
      <stop offset="100%" stop-color="#140813"/>
    </radialGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="40%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="gemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#ec4899" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#collBg)"/>
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Treasure Chest / Gemstone Diamond Crystal / Collector -->
  <g filter="url(#gemGlow)" transform="translate(60,60)">
    <!-- Brilliant faceted diamond gem -->
    <!-- Top flat -->
    <polygon points="-16,-20 16,-20 28,-6 0,26 -28,-6" fill="url(#gemGrad)"/>
    <!-- Facets -->
    <polygon points="-16,-20 16,-20 20,-6 -20,-6" fill="#F472B6" opacity="0.6"/>
    <polygon points="-20,-6 0,-20 20,-6 0,26" fill="#FBCFE8" opacity="0.4"/>
    <polygon points="-20,-6 0,26 -28,-6" fill="#BE185D" opacity="0.6"/>
    <polygon points="20,-6 0,26 28,-6" fill="#9D174D" opacity="0.6"/>
    <line x1="-16" y1="-20" x2="-20" y2="-6" stroke="#FDF2F8" stroke-width="1.5"/>
    <line x1="16" y1="-20" x2="20" y2="-6" stroke="#FDF2F8" stroke-width="1.5"/>
    <line x1="0" y1="-20" x2="0" y2="26" stroke="#FFF" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- Sparkles -->
    <polygon points="-22,-24 -20,-20 -16,-18 -20,-16 -22,-12 -24,-16 -28,-18 -24,-20" fill="#FFFFFF"/>
    <polygon points="22,12 24,15 27,16 24,17 22,20 20,17 17,16 20,15" fill="#FDE047"/>
  </g>
</svg>
