<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="whaleBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0c2d48"/>
      <stop offset="100%" stop-color="#05131f"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#06B6D4" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#whaleBg)"/>
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Whale spout water arches -->
  <g filter="url(#cyanGlow)" transform="translate(60,62)">
    <path d="M 0,-18 Q 0,-32 -10,-32 M 0,-18 Q 0,-35 6,-35" fill="none" stroke="#A5F3FC" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Whale Body -->
    <path d="M -32,-4 C -22,-22 16,-22 28,-8 C 36,-1 40,-4 42,-8 C 42,-2 36,4 32,8 C 22,18 -10,22 -28,8 C -34,3 -36,0 -32,-4 Z" fill="url(#cyanGrad)"/>
    <!-- Whale Belly Lines -->
    <path d="M -16,6 Q -4,14 12,6" fill="none" stroke="#E0F2FE" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M -12,10 Q -2,17 8,10" fill="none" stroke="#E0F2FE" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Whale Eye -->
    <circle cx="-18" cy="-6" r="2.2" fill="#042F2E"/>
    <circle cx="-19" cy="-7" r="0.8" fill="#FFFFFF"/>
    <!-- Water ripples -->
    <ellipse cx="0" cy="22" rx="26" ry="4" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
</svg>
