<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="pokerBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b1111"/>
      <stop offset="100%" stop-color="#140606"/>
    </radialGradient>
    <linearGradient id="spadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="40%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="pokerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#dc2626" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#pokerBg)"/>
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Two playing cards (Ace of Spades & Ace of Hearts) in fan with poker chip -->
  <g filter="url(#pokerGlow)" transform="translate(60,60)">
    <!-- Back Card (Ace of Hearts) angled left -->
    <g transform="translate(-8, -4) rotate(-14)">
      <rect x="-16" y="-24" width="32" height="48" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <!-- Heart icon -->
      <path d="M 0,-6 C -2,-10 -7,-10 -9,-7 C -11,-3 -8,1 0,6 C 8,1 11,-3 9,-7 C 7,-10 2,-10 0,-6 Z" fill="#EF4444" transform="scale(0.85) translate(0, -6)"/>
      <text x="-11" y="-14" fill="#EF4444" font-family="sans-serif" font-weight="900" font-size="8">A</text>
    </g>
    <!-- Front Card (Ace of Spades) angled right -->
    <g transform="translate(8, 2) rotate(12)">
      <rect x="-16" y="-24" width="32" height="48" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
      <!-- Spade icon -->
      <path d="M 0,-12 C 4,-7 11,-4 11,2 C 11,6 8,9 4,9 C 2,9 1,7 0,5 C -1,7 -2,9 -4,9 C -8,9 -11,6 -11,2 C -11,-4 -4,-7 0,-12 Z" fill="#0F172A" transform="scale(0.9) translate(0, -4)"/>
      <path d="M -2,4 L -4,9 L 4,9 L 2,4 Z" fill="#0F172A"/>
      <text x="-11" y="-14" fill="#0F172A" font-family="sans-serif" font-weight="900" font-size="8">A</text>
    </g>
    <!-- Mini Gold Poker Chip overlay -->
    <circle cx="16" cy="16" r="10" fill="#1e1b18" stroke="url(#goldRim)" stroke-width="2.5"/>
    <circle cx="16" cy="16" r="6" fill="none" stroke="url(#goldRim)" stroke-width="1" stroke-dasharray="2 2"/>
    <circle cx="16" cy="16" r="2.5" fill="#FACC15"/>
  </g>
</svg>
