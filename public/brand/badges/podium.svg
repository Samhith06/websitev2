<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="podiumBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2d1d36"/>
      <stop offset="100%" stop-color="#110a16"/>
    </radialGradient>
    <linearGradient id="goldP" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="silverP" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="bronzeP" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#podiumBg)"/>
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.4"/>
  <g filter="url(#pGlow)" transform="translate(60,64)">
    <!-- 2nd Place (Silver - Left) -->
    <rect x="-36" y="-8" width="22" height="32" rx="3" fill="url(#silverP)"/>
    <text x="-25" y="10" fill="#334155" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle">2</text>
    <!-- 1st Place (Gold - Center) -->
    <rect x="-13" y="-22" width="26" height="46" rx="3" fill="url(#goldP)"/>
    <text x="0" y="-2" fill="#78350F" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">1</text>
    <polygon points="0,-29 2,-24 7,-24 3,-21 5,-16 0,-19 -5,-16 -3,-21 -7,-24 -2,-24" fill="#FEF08A"/>
    <!-- 3rd Place (Bronze - Right) -->
    <rect x="14" y="0" width="22" height="24" rx="3" fill="url(#bronzeP)"/>
    <text x="25" y="16" fill="#7C2D12" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle">3</text>
  </g>
</svg>
