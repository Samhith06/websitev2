<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="grindBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a2010"/>
      <stop offset="100%" stop-color="#120d06"/>
    </radialGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="grindGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#grindBg)"/>
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Stopwatch / Hourglass / Gear Grinder -->
  <g filter="url(#grindGlow)" transform="translate(60,60)">
    <!-- Watch body -->
    <circle cx="0" cy="3" r="28" fill="#1c1710" stroke="url(#amberGrad)" stroke-width="3.5"/>
    <!-- Top button -->
    <rect x="-4" y="-32" width="8" height="6" rx="1.5" fill="url(#amberGrad)"/>
    <path d="M -9,-26 C -9,-30 9,-30 9,-26" fill="none" stroke="url(#amberGrad)" stroke-width="2.5"/>
    <!-- Clock ticks -->
    <line x1="0" y1="-21" x2="0" y2="-17" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
    <line x1="21" y1="3" x2="17" y2="3" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="27" x2="0" y2="23" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
    <line x1="-21" y1="3" x2="-17" y2="3" stroke="#FDE68A" stroke-width="2" stroke-linecap="round"/>
    <!-- Watch Hands pointing to 100+ -->
    <line x1="0" y1="3" x2="0" y2="-12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="3" x2="11" y2="3" stroke="url(#amberGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="3" r="3.5" fill="#F59E0B"/>
    <!-- Lightning bolt mini icon on side -->
    <polygon points="12,-16 19,-16 15,-8 21,-8 13,2 15,-5 10,-5" fill="#FEF08A"/>
  </g>
</svg>
