<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="streakBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#361a0d"/>
      <stop offset="100%" stop-color="#140904"/>
    </radialGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="40%" stop-color="#EA580C"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#streakBg)"/>
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Fiery Streak Icon -->
  <g filter="url(#fireGlow)" transform="translate(60,60)">
    <!-- Outer Flame -->
    <path d="M 0,-34 C 8,-22 26,-12 26,10 C 26,24 14,34 0,34 C -14,34 -26,24 -26,10 C -26,-2 -16,-16 -8,-24 C -8,-16 -2,-12 0,-34 Z" fill="url(#fireGrad)"/>
    <!-- Inner Flame Core -->
    <path d="M 0,-12 C 4,-6 14,0 14,14 C 14,22 8,26 0,26 C -8,26 -14,22 -14,14 C -14,4 -8,0 0,-12 Z" fill="#FEF08A"/>
    <!-- White hot spark -->
    <ellipse cx="0" cy="18" rx="5" ry="7" fill="#FFFFFF"/>
  </g>
</svg>
