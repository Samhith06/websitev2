<!--
  The alternate Streak mark, kept beside the one in use.

  This is the flatter, more minimal treatment. `streak.svg` is what the grid
  renders, because the other thirteen badges all carry a coloured border and a
  glow and this one deliberately does not — on its own it is the better mark,
  but in a row of fourteen it reads as the odd one out. Swap the filenames to
  use it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="streakBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="flameGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="innerFlame2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
  </defs>
  <!-- Base tile -->
  <rect width="120" height="120" rx="28" fill="url(#streakBg2)"/>
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="#292524" stroke-width="1.5"/>

  <!-- Minimalist Flame Mark -->
  <g transform="translate(60,60)">
    <!-- Outer flame silhouette -->
    <path d="M 0,-32 C 6,-20 22,-10 22,10 C 22,23 12,32 0,32 C -12,32 -22,23 -22,10 C -22,-2 -14,-14 -6,-22 C -6,-14 0,-10 0,-32 Z" fill="url(#flameGrad2)"/>
    <!-- Negative space carve / inner flame -->
    <path d="M 0,-6 C 4,-2 10,4 10,14 C 10,20 5,24 0,24 C -5,24 -10,20 -10,14 C -10,6 -4,0 0,-6 Z" fill="url(#innerFlame2)"/>
    <!-- Crisp ember dot -->
    <circle cx="0" cy="15" r="3.5" fill="#FFFFFF"/>
  </g>
</svg>
