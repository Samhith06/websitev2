<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="founderBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2d1313"/>
      <stop offset="100%" stop-color="#120606"/>
    </radialGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#ef4444" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#founderBg)"/>
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="#F87171" stroke-width="1.5" stroke-opacity="0.4"/>
  <g filter="url(#fGlow)" transform="translate(60,60)">
    <!-- Outer Shield / Emblem -->
    <path d="M 0,-32 L 28,-18 C 28,12 16,28 0,34 C -16,28 -28,12 -28,-18 Z" fill="#1f1113" stroke="url(#flameGrad)" stroke-width="2.5"/>
    <!-- Keyhole & Star / Pioneer Torch / 30 founding badge -->
    <path d="M 0,-18 C 8,-12 14,-2 8,14 C 4,12 2,8 0,6 C -2,8 -4,12 -8,14 C -14,-2 -8,-12 0,-18 Z" fill="url(#flameGrad)"/>
    <circle cx="0" cy="-4" r="5" fill="#FFFFFF"/>
    <text x="0" y="24" fill="#FCA5A5" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1">EST</text>
  </g>
</svg>
