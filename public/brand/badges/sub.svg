<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="subBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#14331e"/>
      <stop offset="100%" stop-color="#07140b"/>
    </radialGradient>
    <linearGradient id="kickBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#53FC18"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="subGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#53fc18" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#subBg)"/>
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="#53FC18" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Sub Badge with Kick Star / Subscription Badge Star Crest -->
  <g filter="url(#subGlow)" transform="translate(60,60)">
    <!-- Hexagonal star / badge plate -->
    <path d="M 0,-32 L 28,-16 L 28,16 L 0,32 L -28,16 L -28,-16 Z" fill="#0c2414" stroke="url(#kickBrandGrad)" stroke-width="3"/>
    <!-- Inner glowing Kick star -->
    <polygon points="0,-20 6,-7 20,-5 10,6 12,20 0,13 -12,20 -10,6 -20,-5 -6,-7" fill="url(#kickBrandGrad)"/>
    <!-- Core sparkle highlight -->
    <circle cx="0" cy="-2" r="3.5" fill="#FFFFFF"/>
    <!-- SUB lettermark badge at bottom -->
    <rect x="-18" y="18" width="36" height="10" rx="3" fill="#15803D"/>
    <text x="0" y="26" fill="#F0FDF4" font-family="sans-serif" font-weight="900" font-size="8" text-anchor="middle" letter-spacing="1">SUBSCRIBER</text>
  </g>
</svg>
